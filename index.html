<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>MELON/MOLLE</title>
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MelonNotes">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/5968/5968292.png">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    
    <link rel="manifest" href='data:application/json,{"name":"Melon Molle Notes","short_name":"Melon","start_url":".","display":"standalone","background_color":"#ffffff","theme_color":"#000000","icons":[{"src":"https://cdn-icons-png.flaticon.com/512/5968/5968292.png","sizes":"512x512","type":"image/png"}]}'>

    <style>
        :root {
            --bg: #ffffff;
            --text-main: #000000;
            --text-sub: #4b4b4b;
            --border: 2px solid #000000;
            --transition: all 0.6s cubic-bezier(0.85, 0, 0.15, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
        ::-webkit-scrollbar { display: none; }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            /* Ajuste para Notch de iPhone */
            padding: calc(env(safe-area-inset-top) + 20px) 20px env(safe-area-inset-bottom) 20px;
            user-select: none;
        }

        .container { max-width: 1200px; margin: 0 auto; }

        header {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }

        .header-top { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .brand { font-weight: 800; font-size: 20px; text-transform: uppercase; letter-spacing: -1.5px; }

        .search-box {
            border: var(--border);
            padding: 12px 16px;
            display: flex; align-items: center; gap: 10px;
            width: 100%;
            background: #fff;
        }
        .search-box input { border: none; outline: none; font-weight: 700; text-transform: uppercase; font-size: 11px; width: 100%; }

        .btn-molle {
            background: #000; color: #fff;
            border: var(--border);
            padding: 14px; font-weight: 800; cursor: pointer;
            text-transform: uppercase; font-size: 11px; letter-spacing: 1px;
            width: 100%; text-align: center;
        }

        /* GRID RESPONSIVO */
        .notes-grid {
            display: grid;
            grid-template-columns: 1fr;
            border-top: var(--border);
            border-left: var(--border);
            border-right: var(--border);
        }

        .note-card {
            padding: 30px;
            border-bottom: var(--border);
            background: var(--bg);
            min-height: 200px;
            display: flex; flex-direction: column;
            position: relative;
        }

        .note-card h3 { font-size: 18px; font-weight: 800; margin-bottom: 8px; text-transform: uppercase; }
        .note-card p { font-size: 14px; color: var(--text-sub); line-height: 1.5; }

        .note-meta { margin-top: auto; padding-top: 15px; }
        .note-date { font-size: 10px; font-weight: 800; letter-spacing: 1px; display: flex; align-items: center; gap: 5px; }
        .note-date::before { content: ''; width: 6px; height: 6px; background: #000; border-radius: 50%; }

        /* ACCIONES MÓVILES */
        .card-actions { position: absolute; top: 15px; right: 15px; display: flex; gap: 8px; }
        .btn-action { background: none; border: none; font-size: 18px; cursor: pointer; color: #000; }

        /* MORPH OVERLAY FULLSCREEN */
        .morph-overlay { position: fixed; inset: 0; z-index: 9999; display: none; background: #fff; }
        .morph-element { position: absolute; background: #fff; border: var(--border); transition: var(--transition); overflow-y: auto; }
        .morph-element.expanded { inset: 0 !important; width: 100% !important; height: 100% !important; border: none; }
        .morph-content { padding: 80px 30px; }
        .morph-content h1 { font-size: 32px; font-weight: 800; text-transform: uppercase; margin-bottom: 20px; }
        .morph-content p { font-size: 16px; line-height: 1.6; }

        .close-btn { position: fixed; top: 40px; right: 25px; background: #000; color: #fff; border: none; width: 45px; height: 45px; z-index: 10000; display: none; border-radius: 50%; }

        /* MODAL FULLSCREEN PARA MÓVIL */
        .modal { position: fixed; inset: 0; background: #fff; z-index: 5000; display: none; flex-direction: column; padding: 60px 25px; }
        .modal input, .modal textarea { width: 100%; border: 2px solid #000; padding: 18px; margin-bottom: 15px; font-family: inherit; font-weight: 700; outline: none; }
        .modal textarea { flex-grow: 1; font-weight: 400; resize: none; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="header-top">
            <div class="brand">MELON/OS</div>
            <div style="font-size: 10px; font-weight: 800;">V.2.0_STABLE</div>
        </div>
        <div class="search-box">
            <i class="ri-search-line"></i>
            <input type="text" id="searchInput" placeholder="SEARCH_SYSTEM">
        </div>
        <button class="btn-molle" id="newNoteBtn">ADD_NEW_ENTRY</button>
    </header>

    <div id="notesGrid" class="notes-grid"></div>
</div>

<div id="morphOverlay" class="morph-overlay">
    <button class="close-btn" id="closeExpandBtn"><i class="ri-close-line"></i></button>
</div>

<div class="modal" id="formModal">
    <h2 style="margin-bottom:20px; text-transform:uppercase; font-weight:900;">Data_Input</h2>
    <input type="text" id="titleInp" placeholder="ENTRY_TITLE">
    <textarea id="bodyInp" placeholder="DATA_CONTENT..."></textarea>
    <div style="display:flex; gap:10px; margin-top:10px">
        <button class="btn-molle" id="saveNoteBtn">COMMIT</button>
        <button class="btn-molle" style="background:#fff; color:#000" onclick="closeForm()">ABORT</button>
    </div>
</div>

<script>
    const DB_NAME = 'molle_pwa_v1';
    let notes = JSON.parse(localStorage.getItem(DB_NAME)) || [];
    let editingId = null;

    const grid = document.getElementById('notesGrid');
    const overlay = document.getElementById('morphOverlay');
    const formModal = document.getElementById('formModal');

    function render(filter = "") {
        grid.innerHTML = '';
        const filtered = notes.filter(n => n.title.toLowerCase().includes(filter.toLowerCase()));

        filtered.forEach(note => {
            const card = document.createElement('div');
            card.className = 'note-card';
            card.innerHTML = `
                <div class="card-actions">
                    <button class="btn-action" onclick="event.stopPropagation(); editNote(${note.id})"><i class="ri-edit-box-line"></i></button>
                    <button class="btn-action" onclick="event.stopPropagation(); deleteNote(${note.id})"><i class="ri-delete-bin-7-line"></i></button>
                </div>
                <h3>${note.title}</h3>
                <p>${note.body}</p>
                <div class="note-meta">
                    <div class="note-date">${note.date} // ${note.time}</div>
                </div>
            `;
            card.onclick = () => expandNote(card, note);
            grid.appendChild(card);
        });
    }

    function expandNote(card, note) {
        const rect = card.getBoundingClientRect();
        overlay.style.display = 'block';
        const morph = document.createElement('div');
        morph.className = 'morph-element';
        morph.style.top = rect.top + 'px';
        morph.style.left = rect.left + 'px';
        morph.style.width = rect.width + 'px';
        morph.style.height = rect.height + 'px';
        morph.innerHTML = `<div class="morph-content"><div class="note-date" style="margin-bottom:20px">${note.date}</div><h1>${note.title}</h1><p>${note.body}</p></div>`;
        overlay.appendChild(morph);

        requestAnimationFrame(() => {
            morph.classList.add('expanded');
            document.getElementById('closeExpandBtn').style.display = 'block';
        });

        document.getElementById('closeExpandBtn').onclick = () => {
            morph.classList.remove('expanded');
            document.getElementById('closeExpandBtn').style.display = 'none';
            setTimeout(() => { overlay.style.display = 'none'; overlay.removeChild(morph); }, 600);
        };
    }

    document.getElementById('newNoteBtn').onclick = () => { editingId = null; document.getElementById('titleInp').value = ''; document.getElementById('bodyInp').value = ''; formModal.style.display = 'flex'; };

    function editNote(id) {
        const note = notes.find(n => n.id === id);
        editingId = id;
        document.getElementById('titleInp').value = note.title;
        document.getElementById('bodyInp').value = note.body;
        formModal.style.display = 'flex';
    }

    function deleteNote(id) {
        if(confirm('CONFIRM_DELETE?')) { notes = notes.filter(n => n.id !== id); saveAndRefresh(); }
    }

    document.getElementById('saveNoteBtn').onclick = () => {
        const title = document.getElementById('titleInp').value;
        const body = document.getElementById('bodyInp').value;
        if(!title || !body) return;
        const now = new Date();
        const noteData = {
            id: editingId || Date.now(),
            title, body,
            date: now.toLocaleDateString('es-ES', { day: '2-digit', month: 'short' }).toUpperCase(),
            time: now.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' })
        };
        if(editingId) notes = notes.map(n => n.id === editingId ? noteData : n);
        else notes.unshift(noteData);
        saveAndRefresh();
        closeForm();
    };

    function saveAndRefresh() { localStorage.setItem(DB_NAME, JSON.stringify(notes)); render(); }
    function closeForm() { formModal.style.display = 'none'; }
    document.getElementById('searchInput').oninput = (e) => render(e.target.value);
    render();

    // SERVICE WORKER INLINE para funcionamiento Offline
    if ('serviceWorker' in navigator) {
        const sw = `
            self.addEventListener('fetch', function(event) {
                event.respondWith(fetch(event.request).catch(() => caches.match(event.request)));
            });
        `;
        const blob = new Blob([sw], {type: 'text/javascript'});
        navigator.serviceWorker.register(URL.createObjectURL(blob));
    }
</script>

</body>
</html>
